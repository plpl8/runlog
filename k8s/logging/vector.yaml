apiVersion: v1
kind: ServiceAccount
metadata:
  name: vector
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: vector
rules:
  - apiGroups: [""]
    resources: ["pods", "namespaces", "nodes"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: vector
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: vector
subjects:
  - kind: ServiceAccount
    name: vector
    namespace: default
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: vector-config
data:
  vector.yaml: |
    data_dir: /var/lib/vector

    sources:
      kubernetes:
        type: kubernetes_logs

    transforms:
      parse_app_json:
        type: remap
        inputs:
          - kubernetes
        source: |
          parsed, err = parse_json(.message)
          if err == null && is_object(parsed) {
            ., err = merge(., parsed)
          }

    sinks:
      victoria:
        type: http
        inputs:
          - parse_app_json
        uri: "http://victoria-logs.default.svc.cluster.local:9428/insert/jsonline?_stream_fields=kubernetes.pod_name,kubernetes.container_name&_msg_field=message&_time_field=timestamp"
        method: post
        compression: gzip
        encoding:
          codec: json
        framing:
          method: newline_delimited
        healthcheck:
          enabled: false
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: vector
spec:
  selector:
    matchLabels:
      app: vector
  template:
    metadata:
      labels:
        app: vector
    spec:
      serviceAccountName: vector
      tolerations:
        - operator: Exists
      containers:
        - name: vector
          image: timberio/vector:0.45.0-debian
          env:
            - name: VECTOR_SELF_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          args:
            - --config
            - /etc/vector/vector.yaml
          securityContext:
            runAsUser: 0
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: config
              mountPath: /etc/vector
              readOnly: true
            - name: pod-logs
              mountPath: /var/log/pods
              readOnly: true
            - name: container-logs
              mountPath: /var/log/containers
              readOnly: true
            - name: data
              mountPath: /var/lib/vector
            - name: docker-containers
              mountPath: /var/lib/docker/containers
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: vector-config
        - name: pod-logs
          hostPath:
            path: /var/log/pods
            type: Directory
        - name: container-logs
          hostPath:
            path: /var/log/containers
            type: Directory
        - name: data
          hostPath:
            path: /var/lib/vector
            type: DirectoryOrCreate
        - name: docker-containers
          hostPath:
            path: /var/lib/docker/containers
            type: Directory
